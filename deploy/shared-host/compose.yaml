name: melodiajest

services:
  # Compose also publishes the service key as a DNS alias on external networks.
  # Generic names such as web/app/gateway can shadow other portal services.
  melodiajest-static:
    container_name: melodiajest-web-1
    # Reuse the official image already present on the shared host.
    # Record its digest with each release; updating the image is a separate step.
    image: nginx:stable-alpine
    pull_policy: never
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    user: "101:101"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    volumes:
      # On the VPS this file lives at /opt/melodiajest/deploy/compose.yaml.
      # Recreate ONLY this service after switching the current symlink.
      - ../current:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # Only the API socket directory is visible; account databases and secrets
      # stay outside the container and outside the public release tree.
      - /run/melodiajest-account:/run/melodiajest-account:ro
    expose: ["8080"]
    networks:
      edge:
        aliases: [melodiajest-web]
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 64
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

networks:
  edge:
    external: true
    name: libre_public
