  function cleanVirtualPattern(raw){
    const allowed = new Set(Object.keys(KEY_MAP).concat(['[',']','{','}',' ']));
    return String(raw)
      .replace(/[—–|,.;:]/g,' ')
      .replace(/-/g,' ')
      .replace(/ /g,' ')
      .split('')
      .map(ch => allowed.has(ch) ? ch : ' ')
      .join('')
      .replace(/\s+/g,' ')
      .trim();
  }
  function tokenChunks(pattern, approxTokens){
    const tokens=pattern.split(/\s+/).filter(Boolean);
    const chunks=[];
    for(let i=0;i<tokens.length;i+=approxTokens) chunks.push(tokens.slice(i,i+approxTokens).join(' '));
    return chunks;
  }
  function addSongTheme(prefix, theme, raw, approxTokens=44){
    const pattern=cleanVirtualPattern(raw);
    if(!pattern) return;
    const chunks=tokenChunks(pattern, approxTokens);
    chunks.forEach((chunk,idx)=>{
      const long = idx>0 ? (chunks[idx-1]+' '+chunk) : chunk;
      add(prefix+'-part-'+String(idx+1).padStart(2,'0'), theme, 'Фрагмент '+(idx+1), 'Разбор твоих Virtual Piano-нот: сначала фрагменты, затем склейка и итоговая версия. Если текст слишком большой, используй режим «Весь холст».', chunk, Math.max(80, parsePattern(chunk).steps.length*2.6), false);

    });
    add(prefix+'-exam', theme, 'Итоговая мелодия / экзамен', 'Полная версия темы по твоим Virtual Piano-нотам. Цель — сыграть целиком с минимумом ошибок.', pattern, Math.max(180, parsePattern(pattern).steps.length*2.0), true);
  }

  function notesFromLines(raw){
    const parts=[];
    String(raw||'').replace(/\r/g,'').split('\n').forEach((line)=>{
      const trimmed=line.trim();
      if(trimmed==='----') return;
      if(!trimmed){ parts.push('  '); return; }
      const cleaned=cleanVirtualPattern(trimmed);
      if(cleaned) parts.push(cleaned);
    });
    return parts.join('  ').trim();
  }

  function patternChunksBySteps(pattern,maxSteps=84){
    const parsed=parsePattern(pattern);
    const chunks=[]; let current=[]; let actions=0;
    const flush=()=>{ const text=current.join('').replace(/\s+/g,' ').trim(); if(text) chunks.push(text); current=[]; actions=0; };
    parsed.display.forEach((item)=>{
      if(item.kind==='step' && actions>=maxSteps) flush();
      current.push(item.kind==='space'?' ':(item.raw||''));
      if(item.kind==='step') actions++;
    });
    flush();
    return chunks;
  }

  function hashText(value){
    let hash=2166136261;
    for(const ch of String(value)){ hash^=ch.charCodeAt(0); hash=Math.imul(hash,16777619); }
    return (hash>>>0).toString(36);
  }
  function uid(prefix){ return prefix+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8); }
  function cleanThemeName(value){ return String(value||'').replace(/^\s*\d+\s*[.\-)]?\s*/,'').trim(); }
  function clampPosition(value,max){ const n=Math.round(Number(value)||max||1); return Math.max(1,Math.min(Math.max(1,max),n)); }

  function initializeBuiltInCatalog(){
    const themeByOriginal=new Map();
    const lessonIdCounts=new Map();
    const lessonOrderCounts=new Map();
    lessons.forEach((lesson)=>{
      const originalTheme=lesson.theme||'Без темы';
      let theme=themeByOriginal.get(originalTheme);
      if(!theme){
        theme={id:'builtin-theme-'+hashText(originalTheme),name:cleanThemeName(originalTheme)||originalTheme,order:themeByOriginal.size+1};
        themeByOriginal.set(originalTheme,theme);
        themes.push(theme);
      }
      const originalId=String(lesson.id||'lesson');
      const count=(lessonIdCounts.get(originalId)||0)+1;
      lessonIdCounts.set(originalId,count);
      if(count>1) lesson.id=originalId+'--'+count;
      const lessonCount=(lessonOrderCounts.get(theme.id)||0)+1;
      lessonOrderCounts.set(theme.id,lessonCount);
      lesson.themeId=theme.id;
      lesson.order=lessonCount;
      lesson.theme=theme.name;
    });

  }

  function normalizeCatalog(){
    themes.sort((a,b)=>(Number(a.order)||999999)-(Number(b.order)||999999)||String(a.id).localeCompare(String(b.id)));
    themes.forEach((theme,index)=>{ theme.order=index+1; theme.name=cleanThemeName(theme.name)||('Тема '+(index+1)); });
    const themeOrders=new Map(themes.map(theme=>[theme.id,theme.order]));
    const valid=lessons.filter(lesson=>themeOrders.has(lesson.themeId));
    lessons.splice(0,lessons.length,...valid);
    lessons.sort((a,b)=>(themeOrders.get(a.themeId)||999999)-(themeOrders.get(b.themeId)||999999)||(Number(a.order)||999999)-(Number(b.order)||999999)||String(a.id).localeCompare(String(b.id)));
    const counts=new Map();
    lessons.forEach((lesson)=>{
      const next=(counts.get(lesson.themeId)||0)+1;
      counts.set(lesson.themeId,next);
      lesson.order=next;
      const theme=themeById(lesson.themeId);
      lesson.theme=theme?theme.name:'Без темы';
    });
  }

  function moveThemeTo(themeId,position){
    const ordered=[...themes].sort((a,b)=>a.order-b.order);
    const index=ordered.findIndex(theme=>theme.id===themeId);
    if(index<0) return;
    const [theme]=ordered.splice(index,1);
    ordered.splice(clampPosition(position,ordered.length+1)-1,0,theme);
    ordered.forEach((item,i)=>{ item.order=i+1; });
    themes.splice(0,themes.length,...ordered);
    normalizeCatalog();
  }

  function moveLessonTo(lessonId,newThemeId,position){
    const lesson=lessons.find(item=>item.id===lessonId);
    if(!lesson || !themeById(newThemeId)) return;
    const oldThemeId=lesson.themeId;
    lesson.themeId=newThemeId;
    const target=lessons.filter(item=>item.themeId===newThemeId && item.id!==lessonId).sort((a,b)=>a.order-b.order);
    target.splice(clampPosition(position,target.length+1)-1,0,lesson);
    target.forEach((item,index)=>{ item.order=index+1; });
    if(oldThemeId!==newThemeId){
      lessons.filter(item=>item.themeId===oldThemeId).sort((a,b)=>a.order-b.order).forEach((item,index)=>{ item.order=index+1; });
    }
    normalizeCatalog();
  }

  function normalizeLessonRhythm(raw,stepCount){
    if(!raw||typeof raw!=='object'||!Array.isArray(raw.steps)||raw.steps.length!==stepCount) return null;
    const numerator=Math.max(1,Math.min(12,Math.round(Number(raw.timeSignature&&raw.timeSignature.numerator)||4)));
    const denominator=[1,2,4,8,16].includes(Number(raw.timeSignature&&raw.timeSignature.denominator))?Number(raw.timeSignature.denominator):4;
    const bpm=Math.max(20,Math.min(400,Number(raw.bpm)||88));
    const practiceBpm=Math.max(20,Math.min(400,Number(raw.practiceBpm)||bpm));
    const steps=raw.steps.map((step,index)=>({
      startBeat:Math.max(0,Number(step&&step.startBeat)||0),
      durationBeats:Math.max(1/32,Number(step&&step.durationBeats)||.5),
      restBeforeBeats:Math.max(0,Number(step&&step.restBeforeBeats)||0),
      measure:Math.max(1,Math.round(Number(step&&step.measure)||1)),
      beatInMeasure:Math.max(0,Number(step&&step.beatInMeasure)||0),
      sourceStartMs:Math.max(0,Math.round(Number(step&&step.sourceStartMs)||0)),
      sourceDurationMs:Math.max(1,Math.round(Number(step&&step.sourceDurationMs)||1)),
      stepIndex:index
    }));
    for(let index=1;index<steps.length;index++) if(steps[index].startBeat<steps[index-1].startBeat) return null;
    return {version:1,source:String(raw.source||'manual'),bpm,practiceBpm,timeSignature:{numerator,denominator},steps};
  }

      item.themeId=theme.id; item.order=index+1; item.maxErrors=spec.maxErrors;

  function upgradeCatalogToV7(sourceVersion){
    const version=Number(sourceVersion)||1;
    let changed=version<6;
    if(version<3){
      const severance=ensureTheme(SEVERANCE_THEME_NAME);
      const detroit=ensureTheme(DETROIT_THEME_NAME);
      const hachiko=ensureTheme(HACHIKO_THEME_NAME,'builtin-theme-hachiko');
      replaceBuiltInLessons(severance,['fav-severance-safe-','fav-severance-v3-'],severanceLessonSpecs());
      if(version<2) replaceBuiltInLessons(detroit,['fav-detroit-safe-','fav-detroit-easy-','fav-detroit-normal-'],detroitLessonSpecs());
      replaceBuiltInLessons(hachiko,['fav-hachiko-v3-'],hachikoLessonSpecs());
      normalizeCatalog();
      moveThemeTo(severance.id,Math.min(66,themes.length));
      moveThemeTo(detroit.id,Math.min(67,themes.length));
      moveThemeTo(hachiko.id,Math.min(68,themes.length));
      normalizeCatalog();
    }
    if(version<5){
      const newSoul=findThemeByText('new soul')||ensureTheme(NEW_SOUL_THEME_NAME,'builtin-theme-new-soul');
      newSoul.name=NEW_SOUL_THEME_NAME;
      replaceBuiltInLessons(newSoul,['fav-new-soul-v5-'],newSoulLessonSpecs());
      normalizeCatalog();
      moveThemeTo(newSoul.id,Math.min(69,themes.length));
      normalizeCatalog();
    }
    if(version<6 && CHOPIN_MIDI_DEFINITION){
      const chopin=findThemeByText('точный midi-разбор')||ensureTheme(CHOPIN_MIDI_THEME_NAME);
      chopin.name=CHOPIN_MIDI_THEME_NAME;
      replaceBuiltInLessons(chopin,['chopin-midi-'],bundledChopinLessonSpecs());
      normalizeCatalog();
      moveThemeTo(chopin.id,Math.min(70,themes.length));
      normalizeCatalog();
    }
    if(version<7){
      for(const course of BEGINNER_CURRICULUM){
        const prefixes=[course.idPrefix,...course.legacyPrefixes];
        const theme=findThemeByLessonPrefixes(prefixes)||findThemeByText(course.name)||ensureTheme(course.name);
        theme.name=course.name;
        replaceBuiltInLessons(theme,prefixes,curriculumLessonSpecs(course));
      }
      normalizeCatalog();
      for(const course of BEGINNER_CURRICULUM){
        const theme=findThemeByLessonPrefixes([course.idPrefix]);
        if(theme) moveThemeTo(theme.id,Math.min(course.order,themes.length));
      }
      normalizeCatalog();
      changed=true;
    }
    return changed;
  }

  function applyCatalogSnapshot(snapshot){
    if(!snapshot || !Array.isArray(snapshot.themes) || !Array.isArray(snapshot.lessons) || !snapshot.themes.length || !snapshot.lessons.length) return false;
    const nextThemes=snapshot.themes.map((theme,index)=>({
      id:String(theme.id||uid('theme')),name:cleanThemeName(theme.name)||('Тема '+(index+1)),order:Number(theme.order)||index+1,contentKind:window.MusicCatalog.validKind(theme.contentKind)
    }));
    const validThemeIds=new Set(nextThemes.map(theme=>theme.id));
    const usedIds=new Set();
    const nextLessons=[];
    snapshot.lessons.forEach((raw,index)=>{
      if(!validThemeIds.has(String(raw.themeId||''))) return;
      let id=String(raw.id||uid('lesson'));
      while(usedIds.has(id)) id=id+'-'+(index+1);
      usedIds.add(id);
      const pattern=String(raw.pattern||'');
      const parsed=parsePattern(pattern);
      if(!parsed.steps.length) return;
      const item=makeLesson(id,'',String(raw.title||('Урок '+(index+1))),String(raw.description||''),pattern,Math.max(1,Number(raw.timeLimit)||90),Boolean(raw.exam));
      item.contentKind=window.MusicCatalog.validKind(raw.contentKind);
      item.themeId=String(raw.themeId);
      item.order=Math.max(1,Number(raw.order)||1);
      item.maxErrors=Math.max(1,Number(raw.maxErrors)||3);
      if(Object.prototype.hasOwnProperty.call(raw,'rhythm'))item.rhythm=normalizeLessonRhythm(raw.rhythm,item.steps.length);else delete item.rhythm;
      item.curriculumStage=Math.max(0,Math.round(Number(raw.curriculumStage)||0))||null;
      item.guide=normalizeLessonGuide(raw.guide);
      item.learning=raw.learning&&typeof raw.learning==='object'?raw.learning:null;item.lessonReview=raw.lessonReview||null;
      if(['left','right','split','auto'].includes(raw.handMode))item.handMode=raw.handMode;else delete item.handMode;
      item.fingeringSpec=raw.fingeringSpec;
      // Upgrade only the matching built-in exercise's intent; preserve edited music.
      if(!item.fingeringSpec){
        const course=BEGINNER_CURRICULUM.find(c=>item.id.startsWith(c.idPrefix));
        const original=course&&course.lessons.find(spec=>course.idPrefix+spec.id===item.id&&spec.pattern===item.pattern);
        if(original) item.fingeringSpec=BeginnerFingering.build(item,stepMidiList);
      }
      item.theme=(nextThemes.find(theme=>theme.id===item.themeId)||{}).name||'';
      item.fingeringPlan=normalizeStoredFingeringPlan(raw.fingeringPlan,item);
      nextLessons.push(item);
    });
    if(!nextLessons.length) return false;
    themes.splice(0,themes.length,...nextThemes);
    lessons.splice(0,lessons.length,...nextLessons);
    normalizeCatalog();
    catalogMigrationPending=upgradeCatalogToV7(Number(snapshot.version)||1);
    catalogMigrationPending=installReviewedLessons()||catalogMigrationPending;
    return true;
  }

  // One browser writer for every catalog save and import. Keep the exact failed

  function persistBrowserCatalog(raw){
    let previousRaw;
    try{previousRaw=localStorage.getItem(CONTENT_STORAGE_KEY);}catch{return {status:'failed',code:'STORAGE_READ_FAILED'};}
    try{localStorage.setItem(CONTENT_STORAGE_KEY,raw);}catch{return {status:'failed',code:'STORAGE_WRITE_FAILED',previousRaw};}
    try{if(localStorage.getItem(CONTENT_STORAGE_KEY)!==raw)return {status:'unconfirmed',code:'SAVE_NOT_CONFIRMED',previousRaw};}
    catch{return {status:'unconfirmed',code:'SAVE_NOT_CONFIRMED',previousRaw};}
    return {status:'saved',code:null,previousRaw};

        const retry=notice.querySelector('#catalog-save-retry');retry.disabled=catalogSaveSnapshot().saving;retry.textContent=retry.disabled?'Сохранение…':'Повторить сохранение каталога';

  function saveCatalogCandidate(raw,browserResult=persistBrowserCatalog(raw)){
    if(serviceClient){
      const record={serial:++saveSerial,raw,browserResult,browserSaved:browserResult.status==='saved',fileSaved:false,fileStatus:'queued'};catalogSaveRecord=record;
      catalogFileJobs++;updateCatalogSaveFeedback();
      const job=catalogFileQueue.then(async()=>{record.fileStatus='writing';try{serviceClient.requireUser();const expected=JSON.parse(raw),personal=window.CatalogPersonalization.create(serviceBaseCatalog,expected,{baseRelease:window.PBT_RUNTIME.version});const before=window.CatalogPersonalization.apply(serviceBaseCatalog,personal);if(!before.ok||!window.CatalogPersonalization.equivalent(before.snapshot,expected))throw Error('Личные правки не удалось восстановить без изменений. Скачай полный JSON.');const saved=await serviceClient.saveObject('catalog',JSON.stringify(personal));const readback=window.CatalogPersonalization.apply(serviceBaseCatalog,JSON.parse(saved.raw));if(!readback.ok||!window.CatalogPersonalization.equivalent(readback.snapshot,expected))throw Error('Восстановление каталога после записи не подтверждено. Скачай полный JSON.');serviceCatalogRaw=saved.raw;record.fileSaved=true;record.fileStatus='saved';}catch(error){record.fileStatus='failed';state.message=error.message;state.messageType='bad';}finally{catalogFileJobs--;if(record===catalogSaveRecord)updateCatalogSaveFeedback();}return {status:record.fileSaved?'saved':'unsaved',browserSaved:record.browserSaved,fileSaved:record.fileSaved,browserCode:record.browserResult.code};});
      catalogFileQueue=job.catch(()=>{});return job;
    }
    const record={serial:++saveSerial,raw,browserResult,browserSaved:browserResult.status==='saved',fileSaved:false,fileStatus:WEB_RUNTIME?'not-used':'queued'};
    catalogSaveRecord=record;
    const result=()=>({status:record.browserSaved||record.fileSaved?'saved':'unsaved',browserSaved:record.browserSaved,fileSaved:record.fileSaved,browserCode:record.browserResult.code});
    if(WEB_RUNTIME){updateCatalogSaveFeedback();return Promise.resolve(result());}
    catalogFileJobs++;updateCatalogSaveFeedback();
    // Serialize this page's PUT and its readback together. Another tab/server
    // client is not covered by this queue; a whole-application barrier is future work.
    const job=catalogFileQueue.then(async()=>{
      record.fileStatus='writing';if(record===catalogSaveRecord)updateCatalogSaveFeedback();
      try{
        const response=await fetch('/api/content',{method:'PUT',headers:{'Content-Type':'application/json'},body:raw});
        if(!response.ok)throw Error('CATALOG_FILE_WRITE_FAILED');
        const readback=await fetch('/api/content',{cache:'no-store'});
        if(!readback.ok||JSON.stringify((await readback.json()).catalog)!==raw)throw Error('CATALOG_FILE_NOT_CONFIRMED');
        record.fileSaved=true;record.fileStatus='saved';
      }catch{record.fileStatus='failed';}
      finally{catalogFileJobs--;if(record===catalogSaveRecord)updateCatalogSaveFeedback();}
      return result();
    });

  }

  function readMidiVarLen(view,cursor,end){
    let value=0,guard=0;
    while(cursor.pos<end && guard<4){
      const byte=view.getUint8(cursor.pos++); value=(value<<7)|(byte&0x7f); guard++;
      if(!(byte&0x80)) return value;
    }
    if(guard>=4) return value;
    throw new Error('Повреждённое MIDI-значение переменной длины.');
  }

  function readMidiAscii(view,offset,length){
    let out=''; for(let i=0;i<length;i++) out+=String.fromCharCode(view.getUint8(offset+i)); return out;
  }

  function parseMidiArrayBuffer(buffer){
    const view=new DataView(buffer); let pos=0;
    if(view.byteLength<14 || readMidiAscii(view,0,4)!=='MThd') throw new Error('Это не Standard MIDI File: заголовок MThd не найден.');
    const headerLength=view.getUint32(4); if(headerLength<6 || 8+headerLength>view.byteLength) throw new Error('Повреждён заголовок MIDI.');
    const format=view.getUint16(8), trackCount=view.getUint16(10), division=view.getUint16(12); pos=8+headerLength;
    const notes=[],tempos=[],timeSignatures=[],activeNotes=new Map(); let finalTick=0;
    for(let track=0;track<trackCount && pos+8<=view.byteLength;track++){
      const chunkId=readMidiAscii(view,pos,4), length=view.getUint32(pos+4); pos+=8;
      const end=Math.min(view.byteLength,pos+length);
      if(chunkId!=='MTrk'){ pos=end; continue; }
      let tick=0,runningStatus=0;
      while(pos<end){
        const cursor={pos}; const delta=readMidiVarLen(view,cursor,end); pos=cursor.pos; tick+=delta; finalTick=Math.max(finalTick,tick);
        if(pos>=end) break;
        let status=view.getUint8(pos);
        if(status<0x80){ if(!runningStatus) throw new Error('Некорректный running status в MIDI.'); status=runningStatus; }
        else{ pos++; if(status<0xf0) runningStatus=status; else runningStatus=0; }
        if(status===0xff){
          if(pos>=end) break; const type=view.getUint8(pos++); const c={pos}; const len=readMidiVarLen(view,c,end); pos=c.pos;
          if(type===0x51 && len===3 && pos+3<=end){ tempos.push({tick,usPerQuarter:(view.getUint8(pos)<<16)|(view.getUint8(pos+1)<<8)|view.getUint8(pos+2)}); }
          if(type===0x58 && len>=2 && pos+2<=end){ timeSignatures.push({tick,numerator:view.getUint8(pos),denominator:Math.pow(2,view.getUint8(pos+1))}); }
          pos=Math.min(end,pos+len); if(type===0x2f) break; continue;
        }
        if(status===0xf0 || status===0xf7){ const c={pos}; const len=readMidiVarLen(view,c,end); pos=Math.min(end,c.pos+len); continue; }
        const command=status&0xf0,channel=status&0x0f; const dataLength=(command===0xc0||command===0xd0)?1:2;
        if(pos+dataLength>end) break;
        const d1=view.getUint8(pos++), d2=dataLength===2?view.getUint8(pos++):0;
        const key=track+':'+channel+':'+d1,isOn=command===0x90&&d2>0,isOff=command===0x80||(command===0x90&&d2===0);
        if(isOn){ const queue=activeNotes.get(key)||[]; queue.push({startTick:tick,tick,note:d1,velocity:d2,track,channel}); activeNotes.set(key,queue); }
        else if(isOff){ const queue=activeNotes.get(key); if(queue&&queue.length){ const event=queue.shift(); event.endTick=Math.max(tick,event.startTick+1); notes.push(event); if(!queue.length) activeNotes.delete(key); } }
      }
      pos=end;
    }
    activeNotes.forEach(queue=>queue.forEach(event=>{ event.endTick=Math.max(finalTick,event.startTick+Math.max(1,Math.round((division&0x7fff)/4))); notes.push(event); }));
    if(!notes.length) throw new Error('В MIDI-файле не найдено ни одного события Note On.');
    notes.sort((a,b)=>a.startTick-b.startTick||a.note-b.note||a.track-b.track);
    tempos.sort((a,b)=>a.tick-b.tick);
    timeSignatures.sort((a,b)=>a.tick-b.tick);
    let tickToMs;
    let ppq=0;
    if(division&0x8000){
      const fps=256-((division>>8)&0xff),ticksPerFrame=division&0xff;
      if(!fps||!ticksPerFrame) throw new Error('Некорректное SMPTE-деление времени.');
      tickToMs=tick=>tick*1000/(fps*ticksPerFrame);
    }else{
      ppq=division||480; const map=[{tick:0,ms:0,usPerQuarter:500000}];
      let lastTick=0,lastMs=0,lastTempo=500000;
      tempos.forEach(t=>{ if(t.tick<lastTick) return; lastMs+=(t.tick-lastTick)*lastTempo/ppq/1000; lastTick=t.tick; lastTempo=t.usPerQuarter; if(map.length&&map[map.length-1].tick===t.tick) map[map.length-1]={tick:t.tick,ms:lastMs,usPerQuarter:lastTempo}; else map.push({tick:t.tick,ms:lastMs,usPerQuarter:lastTempo}); });
      tickToMs=tick=>{ let segment=map[0]; for(let i=1;i<map.length&&map[i].tick<=tick;i++) segment=map[i]; return segment.ms+(tick-segment.tick)*segment.usPerQuarter/ppq/1000; };
    }
    notes.forEach(note=>{ note.ms=note.startMs=tickToMs(note.startTick); note.endMs=tickToMs(note.endTick); note.durationMs=Math.max(1,note.endMs-note.startMs); });
    if(!tempos.length||tempos[0].tick!==0) tempos.unshift({tick:0,usPerQuarter:500000});
    if(!timeSignatures.length||timeSignatures[0].tick!==0) timeSignatures.unshift({tick:0,numerator:4,denominator:4});
    return {format,trackCount,division,ppq,notes,tempos,timeSignatures,tickToMs};
  }

  function midiVirtualKey(midi){ const keys=MIDI_TO_KEYS[midi]; return keys&&keys.length?keys[0]:null; }

  function convertParsedMidi(parsed,options){
    const chordWindow=Math.max(0,Math.min(250,Number(options.chordWindow)||0));
    const shift=Math.max(-4,Math.min(4,Number(options.octaveShift)||0))*12;
    const autoFit=Boolean(options.autoFit); const groups=[]; let fitted=0,discarded=0;
    parsed.notes.forEach(event=>{
      let midi=event.note+shift;
      if(autoFit){ while(midi<36){midi+=12;fitted++;} while(midi>96){midi-=12;fitted++;} }
      const key=midiVirtualKey(midi); if(!key){discarded++;return;}
      let group=groups[groups.length-1];
      if(!group || event.startMs-group.startMs>chordWindow){ group={startMs:event.startMs,startTick:event.startTick,endTick:event.endTick,notes:[]}; groups.push(group); }
      group.startTick=Math.min(group.startTick,event.startTick); group.endTick=Math.max(group.endTick,event.endTick);
      if(!group.notes.some(item=>item.midi===midi)) group.notes.push({midi,key,event});
    });
    if(!groups.length) throw new Error('После выбранного сдвига ни одна нота не попала в диапазон Virtual Piano C2–C7.');
    let chords=0; const lines=[]; let line=[];
    groups.forEach((group,index)=>{
      group.notes.sort((a,b)=>a.midi-b.midi); const keys=group.notes.map(item=>item.key); if(keys.length>1) chords++;
      const token=keys.length>1?'['+keys.join('')+']':keys[0];
      if(index>0 && group.startMs-groups[index-1].startMs>1200) line.push('  ');
      line.push(token);
      if(line.filter(value=>value.trim()).length>=18){ lines.push(line.join(' ').replace(/\s{3,}/g,'   ').trim()); line=[]; }
    });
    if(line.length) lines.push(line.join(' ').replace(/\s{3,}/g,'   ').trim());
    const signature=parsed.timeSignatures&&parsed.timeSignatures[0]||{numerator:4,denominator:4},ppq=parsed.ppq||480;
    const beatsPerMeasure=signature.numerator*4/signature.denominator,firstTick=groups[0].startTick;
    const sourceBpm=Math.round(60000000/Math.max(1,(parsed.tempos&&parsed.tempos[0]&&parsed.tempos[0].usPerQuarter)||500000));
    const rhythmSteps=groups.map((group,index)=>{
      const absoluteBeat=group.startTick/ppq,startBeat=(group.startTick-firstTick)/ppq,durationBeats=Math.max(1/32,(group.endTick-group.startTick)/ppq);
      const previousEndBeat=index?(groups[index-1].endTick-firstTick)/ppq:startBeat;
      const endMs=Math.max.apply(null,group.notes.map(item=>item.event.endMs));
      return {startBeat:Math.round(startBeat*96)/96,durationBeats:Math.round(durationBeats*96)/96,restBeforeBeats:Math.round(Math.max(0,startBeat-previousEndBeat)*96)/96,measure:Math.floor(absoluteBeat/beatsPerMeasure)+1,beatInMeasure:Math.round((absoluteBeat%beatsPerMeasure)*96)/96,sourceStartMs:Math.round(group.startMs-groups[0].startMs),sourceDurationMs:Math.max(1,Math.round(endMs-group.startMs))};
    });
    const rhythm=normalizeLessonRhythm({version:1,source:'midi',bpm:sourceBpm,practiceBpm:sourceBpm>180?Math.round(sourceBpm/2):sourceBpm,timeSignature:{numerator:signature.numerator,denominator:signature.denominator},steps:rhythmSteps},groups.length);
    return {text:lines.join('\n'),groups:groups.length,chords,fitted,discarded,noteEvents:parsed.notes.length,rhythm};
  }

  async function convertMidiFile(file){
    if(!file) return;
    try{
      if(file.size>25*1024*1024) throw new Error('Файл слишком большой. Максимум 25 МБ.');
      const buffer=await file.arrayBuffer(); const parsed=parseMidiArrayBuffer(buffer);
      const chordWindow=document.getElementById('midi-chord-window');

      if(!state.editor || state.editor.kind!=='midi') return;

      const copy=document.getElementById('midi-copy'); if(copy) copy.disabled=false;
    }catch(error){
      if(state.editor&&state.editor.kind==='midi'){ state.editor.result=''; state.editor.rhythm=null; state.editor.summary='<b>Ошибка:</b> '+escapeHtml(error&&error.message?error.message:error); }
      const output=document.getElementById('midi-output'); if(output) output.value='';
      const summary=document.getElementById('midi-summary'); if(summary) summary.innerHTML=state.editor?state.editor.summary:'Ошибка конвертации.';
    }
  }

  function recognizedAudioToVirtual(recognized,options){
    const chordWindow=Math.max(0,Math.min(250,Number(options.chordWindow)||55)),shift=Math.max(-4,Math.min(4,Number(options.octaveShift)||0))*12,autoFit=Boolean(options.autoFit);
    const groups=[]; let fitted=0,discarded=0;
    recognized.notes.forEach(event=>{
      let midi=event.note+shift;
      if(autoFit){ while(midi<36){midi+=12;fitted++;} while(midi>96){midi-=12;fitted++;} }
      const key=midiVirtualKey(midi); if(!key){discarded++;return;}
      let group=groups[groups.length-1];
      if(!group||event.startMs-group.startMs>chordWindow){ group={startMs:event.startMs,endMs:event.endMs,notes:[]}; groups.push(group); }
      group.endMs=Math.max(group.endMs,event.endMs);
      if(!group.notes.some(item=>item.midi===midi)) group.notes.push({midi,key,event});
    });
    if(!groups.length) throw new Error('Распознанные звуки не попали в диапазон Virtual Piano C2–C7.');
    const tokens=groups.map(group=>{ group.notes.sort((a,b)=>a.midi-b.midi); const keys=group.notes.map(item=>item.key); return keys.length>1?'['+keys.join('')+']':keys[0]; });
    const lines=[]; for(let index=0;index<tokens.length;index+=18) lines.push(tokens.slice(index,index+18).join(' '));
    const bpm=Math.max(30,Math.min(320,Number(options.bpm)||90)),beatMs=60000/bpm,numerator=Math.max(1,Math.min(12,Math.round(Number(options.numerator)||4))),denominator=[2,4,8].includes(Number(options.denominator))?Number(options.denominator):4,beatsPerMeasure=numerator*4/denominator,originMs=groups[0].startMs;
    const steps=groups.map((group,index)=>{
      const startBeat=(group.startMs-originMs)/beatMs,durationBeats=Math.max(1/16,(group.endMs-group.startMs)/beatMs),previousEndBeat=index?(groups[index-1].endMs-originMs)/beatMs:startBeat;
      return {startBeat:Math.round(startBeat*16)/16,durationBeats:Math.round(durationBeats*16)/16,restBeforeBeats:Math.round(Math.max(0,startBeat-previousEndBeat)*16)/16,measure:Math.floor(startBeat/beatsPerMeasure)+1,beatInMeasure:Math.round((startBeat%beatsPerMeasure)*16)/16,sourceStartMs:Math.round(group.startMs-originMs),sourceDurationMs:Math.max(1,Math.round(group.endMs-group.startMs))};
    });
    const rhythm=normalizeLessonRhythm({version:1,source:'audio-recognition',bpm,practiceBpm:bpm,timeSignature:{numerator,denominator},steps},groups.length);
    return {text:lines.join('\n'),groups:groups.length,chords:groups.filter(group=>group.notes.length>1).length,fitted,discarded,rhythm};
  }

  function formatFingeringPlan(lesson,plan){
    if(!lesson||!plan||!Array.isArray(plan.steps)) return '';
    const tokens=lesson.steps.map((step,index)=>{ const assignments=plan.steps[index]||[]; return stepLabel(step)+'→'+(assignments.length?assignments.map(item=>(item.hand==='left'?'Л':'П')+item.num).join('+'):'нужен разбор'); });
    const lines=[]; for(let i=0;i<tokens.length;i+=12) lines.push(tokens.slice(i,i+12).join('  ')); return lines.join('\n');
  }
  function refreshEditorFingeringStatus(){
    if(!state.editor||state.editor.kind!=='lesson') return;
    const status=document.getElementById('editor-fingering-status'),preview=document.getElementById('editor-fingering-preview');
    let draft; try{ draft=editorLessonDraft(); }catch(error){ return; }
    if(state.editor.draftFingeringPlan&&state.editor.draftFingeringPlan.signature!==fingeringSignature(draft)) state.editor.draftFingeringPlan=null;
    const existing=state.editor.id?lessons.find(item=>item.id===state.editor.id):null;
    const plan=state.editor.draftFingeringPlan||(existing&&hasValidStoredFingering(existing)&&existing.fingeringPlan.signature===fingeringSignature(draft)?existing.fingeringPlan:null);
    if(preview) preview.value=plan?formatFingeringPlan(draft,plan):'';
    if(status){
      if(state.editor.draftFingeringPlan){ status.className='fingering-status good'; status.textContent='Новый расчёт готов. Нажми «Сохранить урок», чтобы записать его в trainer-content.json.'; }
      else if(plan){ status.className='fingering-status good'; status.textContent='Сохранённый расчёт подходит к текущим нотам и режиму рук.'; }
      else{ status.className='fingering-status warn'; status.textContent='Ноты или режим рук изменены. Нажми «Рассчитать аппликатуру» перед сохранением, чтобы записать новый план.'; }
    }
  }

  function editorLessonDraft(){
    const pattern=String((document.getElementById('editor-lesson-pattern')||{}).value||'').trim(),parsed=parsePattern(pattern),themeId=String((document.getElementById('editor-lesson-theme')||{}).value||'');
    const draft=makeLesson('editor-preview',(themeById(themeId)||{}).name||'',String((document.getElementById('editor-lesson-title')||{}).value||''),String((document.getElementById('editor-lesson-description')||{}).value||''),pattern,90,false);
    draft.themeId=themeId; draft.steps=parsed.steps; draft.display=parsed.display;
    const existing=state.editor.id?lessons.find(item=>item.id===state.editor.id):null;
    draft.handMode=existing&&existing.handMode;
    draft.fingeringSpec=existing&&existing.pattern===pattern?existing.fingeringSpec:null;
    draft.rhythm=state.editor.draftRhythm||(existing&&existing.pattern===pattern?existing.rhythm:null);
    return draft;
  }
  function calculateEditorFingering(){
    const status=document.getElementById('editor-fingering-status'),button=document.getElementById('editor-calc-fingering');
    try{
      const draft=editorLessonDraft(); if(!draft.steps.length) throw new Error('Сначала введи распознаваемые ноты урока.');
      if(button){ button.disabled=true; button.textContent='Расчёт…'; }
      const plan=buildFingeringPlan(draft);
      if(plan.issues.length) throw new Error(plan.issues.length+' действий требуют разбора с преподавателем; автоматические подсказки для них не назначены.');
      state.editor.draftFingeringPlan=plan;
      const preview=document.getElementById('editor-fingering-preview'); if(preview) preview.value=formatFingeringPlan(draft,plan);
      if(status){ status.className='fingering-status good'; status.textContent='Готово: рассчитано '+plan.stats.actions+' действий, назначений левой руки: '+plan.stats.leftNotes+', правой: '+plan.stats.rightNotes+'. Нажми «Сохранить урок», чтобы записать план в trainer-content.json.'; }
      if(button){ button.disabled=false; button.textContent='Пересчитать аппликатуру'; }
    }catch(error){ if(status){status.className='fingering-status warn';status.textContent='Не удалось рассчитать: '+(error&&error.message?error.message:error);} if(button){button.disabled=false;button.textContent='Рассчитать аппликатуру';} }
  }

  function saveThemeFromEditor(){
    if(!serviceRequireCustomization())return;
    const nameInput=document.getElementById('editor-theme-name');
    const orderInput=document.getElementById('editor-theme-order');
    const name=cleanThemeName(nameInput&&nameInput.value);
    if(!name){ alert('Введите название темы.'); if(nameInput) nameInput.focus(); return; }
    const requested=clampPosition(orderInput&&orderInput.value,themes.length+(state.editor.id?0:1));
    let theme=state.editor.id?themeById(state.editor.id):null;
    const contentKind=window.MusicCatalog.validKind(document.getElementById('editor-theme-kind')?.value);
    if(theme){theme.name=name;theme.contentKind=contentKind;}
    else{ theme={id:uid('theme'),name,order:themes.length+1,contentKind}; themes.push(theme); }
    moveThemeTo(theme.id,requested);
    state.editor=null;
    state.message='Тема «'+theme.name+'» изменена и перемещена на позицию '+theme.order+'.';
    state.messageType='good';
    saveCatalog();
  }

  function saveLessonFromEditor(){
    if(!serviceRequireCustomization())return;
    const titleInput=document.getElementById('editor-lesson-title');
    const patternInput=document.getElementById('editor-lesson-pattern');
    const themeInput=document.getElementById('editor-lesson-theme');
    const orderInput=document.getElementById('editor-lesson-order');
    const title=String(titleInput&&titleInput.value||'').trim();
    const pattern=String(patternInput&&patternInput.value||'').trim();
    let themeId=String(themeInput&&themeInput.value||'');
    const contentKind=window.MusicCatalog.validKind(document.getElementById('editor-lesson-kind')?.value)||(state.contentSection==='pieces'?'piece':'exercise');
    const parsed=parsePattern(pattern);
    if(!title){ alert('Введите название урока.'); if(titleInput) titleInput.focus(); return; }
    if(themeId!=='__new_work__'&&!themeById(themeId)){ alert('Выберите тему.'); return; }
    if(!parsed.steps.length){ alert('В поле нот нет ни одной распознанной клавиши. Используй символы раскладки Virtual Piano.'); if(patternInput) patternInput.focus(); return; }
    const description=String(document.getElementById('editor-lesson-description').value||'').trim();
    const timeLimit=Math.max(1,Math.round(Number(document.getElementById('editor-lesson-time').value)||90));
    const maxErrors=Math.max(1,Math.round(Number(document.getElementById('editor-lesson-errors').value)||3));
    const exam=Boolean(document.getElementById('editor-lesson-exam').checked);
    if(themeId==='__new_work__'){const theme={id:uid('theme'),name:title,order:themes.length+1,contentKind};themes.push(theme);themeId=theme.id;}
    let lesson=state.editor.id?lessons.find(item=>item.id===state.editor.id):null;
    const previousPlan=lesson&&hasValidStoredFingering(lesson)?lesson.fingeringPlan:null;
    const previousPattern=lesson?lesson.pattern:null,previousRhythm=lesson?lesson.rhythm:null;
    if(lesson){
      Object.assign(lesson,{title,description,pattern,timeLimit,maxErrors,exam,steps:parsed.steps,display:parsed.display});
    }else{
      lesson=makeLesson(uid('lesson'),' ',title,description,pattern,timeLimit,exam);
      lesson.maxErrors=maxErrors;
      lesson.themeId=themeId;
      lesson.order=lessons.filter(item=>item.themeId===themeId).length+1;
      lessons.push(lesson);
    }
    lesson.contentKind=contentKind;
    lesson.themeId=themeId;
    lesson.theme=(themeById(themeId)||{}).name||'';
    const importedRhythm=normalizeLessonRhythm(state.editor&&state.editor.draftRhythm,lesson.steps.length);
    if(importedRhythm) lesson.rhythm=importedRhythm;
    else if(previousPattern===pattern) lesson.rhythm=normalizeLessonRhythm(previousRhythm,lesson.steps.length);
    else lesson.rhythm=null;
    if(previousPattern!==pattern) lesson.fingeringSpec=null;
    const draftPlan=state.editor&&state.editor.draftFingeringPlan;
    if(draftPlan && draftPlan.signature===fingeringSignature(lesson)) lesson.fingeringPlan=draftPlan;
    else if(previousPlan && previousPlan.signature===fingeringSignature(lesson)) lesson.fingeringPlan=previousPlan;
    else lesson.fingeringPlan=null;
    lesson._autoFingeringPlan=null;
    moveLessonTo(lesson.id,themeId,orderInput&&orderInput.value);
    state.lesson=lesson;state.contentSection=sectionOf(lesson);state.sectionEmpty=false;rememberCatalogSelection();
    state.editor=null;
    state.sidebarFollowPending=true;
    resetLessonState(true);
    state.message='Изменения урока «'+lesson.title+'» применены на этой странице.';
    state.messageType='good';
    saveCatalog();
  }

  function deleteThemeFromEditor(){
    const theme=themeById(state.editor&&state.editor.id);
    if(!theme) return;
    const themeLessons=lessons.filter(lesson=>lesson.themeId===theme.id);
    if(lessons.length-themeLessons.length<1){ alert('Нельзя удалить тему, потому что после этого не останется ни одного урока.'); return; }
    if(!confirm('Удалить тему «'+theme.name+'» и все её уроки ('+themeLessons.length+')?')) return;
    themes.splice(themes.indexOf(theme),1);
    const remaining=lessons.filter(lesson=>lesson.themeId!==theme.id);
    lessons.splice(0,lessons.length,...remaining);
    normalizeCatalog();
    if(!lessons.includes(state.lesson)) state.lesson=lessons[0];
    state.editor=null;
    resetLessonState(true);
    state.message='Тема удалена.';
    state.messageType='good';
    saveCatalog();
  }

  function deleteLessonFromEditor(){
    const lesson=lessons.find(item=>item.id===(state.editor&&state.editor.id));
    if(!lesson) return;
    if(lessons.length<=1){ alert('Нельзя удалить последний урок.'); return; }
    if(!confirm('Удалить урок «'+lesson.title+'»?')) return;
    lessons.splice(lessons.indexOf(lesson),1);
    normalizeCatalog();
    if(state.lesson===lesson) state.lesson=lessons[0];
    state.editor=null;
    resetLessonState(true);
    state.message='Урок удалён.';
    state.messageType='good';
    saveCatalog();
  }

      state.message=(error&&error.message?error.message:String(error))+(releasedMidi?(state.midiBridgeWindowOpen?' Windows-окно могло открыться; проверь его или закрой перед прямым подключением MIDI.':' Прямое подключение браузера восстановлено автоматически.'):' MIDI-порт тренажёра остался подключён.');

    }
  }

    const bm=document.getElementById('bold-mode'); if(bm) bm.onchange=e=>{state.boldMode=e.target.value;saveUiPreferences();render();};
    [['show-notes','showNotes'],['show-qwerty','showQwerty'],['show-octaves','showOctaves'],['show-octave-start','showOctaveStart'],['show-fingers','showFingers']].forEach(([id,key])=>{ const el=document.getElementById(id); if(el) el.onchange=e=>{state[key]=e.target.checked;if(['showNotes','showQwerty','showFingers'].includes(key)){state.blindMode=false;state.blindRestore=null;}saveUiPreferences();render();}; });
    const fingerLookahead=document.getElementById('finger-lookahead'); if(fingerLookahead) fingerLookahead.onchange=e=>{state.fingerLookahead=Number(e.target.value);state.blindMode=false;state.blindRestore=null;saveUiPreferences();render();};
    document.querySelectorAll('[data-blind-mode]').forEach((button,index)=>button.onclick=()=>{setBlindMode(!state.blindMode);document.querySelectorAll('[data-blind-mode]')[index]?.focus?.();});
    const calculateCurrent=document.getElementById('calculate-current-fingering'); if(calculateCurrent) calculateCurrent.onclick=calculateCurrentFingering;
    const fingeringHelp=document.getElementById('fingering-help'); if(fingeringHelp) fingeringHelp.onclick=()=>{state.editor={kind:'fingering-help'};render();};
    const midiBtn=document.getElementById('midi-btn'); if(midiBtn) midiBtn.onclick=connectMidi; const ms=document.getElementById('midi-select'); if(ms) ms.onchange=e=>selectMidiInput(e.target.value);
    const dp=document.getElementById('demo-play'); if(dp) dp.onclick=()=>{ state.playbackPlaying ? pausePlayback() : startPlayback(); };
    const ds=document.getElementById('demo-stop'); if(ds) ds.onclick=()=>stopPlayback(true);
    const dpos=document.getElementById('demo-position'); if(dpos) dpos.oninput=e=>{ clearPlaybackRelease();if(state.playbackTimer){clearTimeout(state.playbackTimer);state.playbackTimer=null;} state.playbackIndex=Number(e.target.value); state.playbackVisualActive=true; state.playbackActive=new Set(); state.scoreFollowPending=state.scoreFollow; if(state.playbackPlaying){state.playbackNextAt=performance.now();playbackTick();}else{renderPlaybackOnly();renderKeyboardOnly();} };
    const dbpm=document.getElementById('demo-bpm'); if(dbpm) dbpm.oninput=e=>changePracticeBpm(e.target.value);

    const form=document.getElementById('editor-form');
    const editorClose=document.getElementById('editor-close'); if(editorClose) editorClose.onclick=closeEditor;
    const editorCancel=document.getElementById('editor-cancel'); if(editorCancel) editorCancel.onclick=closeEditor;
    const backdrop=document.getElementById('editor-backdrop'); if(backdrop) backdrop.onclick=(event)=>{ if(event.target===backdrop) closeEditor(); };
    if(form){
      form.onsubmit=(event)=>{ event.preventDefault(); if(state.editor.kind==='midi') return; state.editor.kind==='theme'?saveThemeFromEditor():saveLessonFromEditor(); };
      if(state.editor.kind==='midi'){
        const file=document.getElementById('midi-file'); if(file) file.onchange=()=>convertMediaFile(file.files&&file.files[0]);
        const refreshCurrent=()=>{ if(!state.editor.file) return; if(state.editor.mediaType==='midi') convertMidiFile(state.editor.file); else { const summary=document.getElementById('midi-summary'); if(summary) summary.innerHTML=state.editor.summary+'<br><b>Настройки изменены:</b> нажми «Распознать аудио заново».'; } };
        const chord=document.getElementById('midi-chord-window'); if(chord) chord.onchange=()=>{state.editor.chordWindow=Number(chord.value)||35; refreshCurrent();};
        const shift=document.getElementById('midi-octave-shift'); if(shift) shift.onchange=()=>{state.editor.octaveShift=Number(shift.value)||0; refreshCurrent();};
        const fit=document.getElementById('midi-auto-fit'); if(fit) fit.onchange=()=>{state.editor.autoFit=fit.checked; refreshCurrent();};
        const copy=document.getElementById('midi-copy'); if(copy) copy.onclick=copyMidiResult;
        const create=document.getElementById('midi-create-lesson'); if(create) create.onclick=createLessonFromMidi;
        const reanalyze=document.getElementById('media-reanalyze'); if(reanalyze) reanalyze.onclick=()=>state.editor.file&&convertAudioFile(state.editor.file);
      }
      const deleteButton=document.getElementById('editor-delete'); if(deleteButton) deleteButton.onclick=()=>state.editor.kind==='theme'?deleteThemeFromEditor():deleteLessonFromEditor();
      const addLessonButton=document.getElementById('editor-add-lesson'); if(addLessonButton) addLessonButton.onclick=()=>{ const themeId=state.editor.id; state.editor={kind:'lesson',id:null,themeId}; render(); };
      const pattern=document.getElementById('editor-lesson-pattern'); if(pattern) pattern.oninput=()=>{ const preview=document.getElementById('pattern-preview'); if(preview) preview.textContent='Распознано действий: '+parsePattern(pattern.value).steps.length; refreshEditorFingeringStatus(); };
      ['editor-lesson-title','editor-lesson-description'].forEach(id=>{ const input=document.getElementById(id); if(input) input.oninput=refreshEditorFingeringStatus; });
      const calcFingering=document.getElementById('editor-calc-fingering'); if(calcFingering) calcFingering.onclick=calculateEditorFingering;
      const themeSelect=document.getElementById('editor-lesson-theme'); if(themeSelect) themeSelect.onchange=()=>{ if(!state.editor.id){ const order=document.getElementById('editor-lesson-order'); if(order) order.value=lessons.filter(item=>item.themeId===themeSelect.value).length+1; } refreshEditorFingeringStatus(); };
      setTimeout(()=>{ const first=form.querySelector('input:not([type="checkbox"]),textarea,select'); if(first) first.focus(); },0);
    }

    const side=lessonScrollEl(); if(side){ side.onscroll=()=>{state.sidebarScroll=side.scrollTop;}; restoreSidebarPosition(); }
    const score=scoreScrollEl(); if(score){ score.onscroll=()=>{state.scoreScroll=score.scrollTop;state.scoreScrollLeft=score.scrollLeft;}; restoreScorePosition(); }
    syncSideCardHeight();
    bindKeyMouseHandlers();
    scheduleInitialKeyboardFit();
  }
  function bindKeyMouseHandlers(){
    document.querySelectorAll('.key').forEach(k=>{ k.onmousedown=(e)=>{e.preventDefault(); const m=Number(k.dataset.midi); state.mouseMidi=m; handleNoteOn(m);}; k.onmouseup=()=>{ if(state.mouseMidi!==null){handleNoteOff(state.mouseMidi);state.mouseMidi=null;} }; k.onmouseleave=()=>{ if(state.mouseMidi===Number(k.dataset.midi)){handleNoteOff(state.mouseMidi);state.mouseMidi=null;} }; });
  }
  function isTypingTarget(target){ return target && ['INPUT','TEXTAREA','SELECT'].includes(target.tagName); }
  function isUiControlTarget(target){return Boolean(target?.closest?.('button:not([data-midi]),a,summary,[role="button"],[contenteditable="true"]'));}
  window.addEventListener('keydown', (e)=>{
    if(e.key==='Escape' && state.editor){ e.preventDefault(); closeEditor(); return; }
    if(state.editor || isTypingTarget(e.target) || e.repeat) return;
    if(e.key==='F2'){e.preventDefault(); resetLesson(); return;} if(e.key==='F3'){e.preventDefault(); nextLesson(); return;} if(e.key==='F4'){e.preventDefault(); state.soundOn=!state.soundOn; if(state.soundOn) ensureAudio(); render(); return;}
    if(isUiControlTarget(e.target)&&['Enter',' '].includes(e.key))return;
    if(state.midiBridgeConnected && KEY_MAP[e.key]!==undefined){ e.preventDefault(); return; }
    const k=e.key; if(KEY_MAP[k]!==undefined){ e.preventDefault(); state.pcPressedByCode[e.code]=k; handleNoteOn(KEY_MAP[k], k); }
  });
  window.addEventListener('keyup', (e)=>{
    const pressed=state.pcPressedByCode[e.code];
    if(pressed!==undefined){ e.preventDefault(); delete state.pcPressedByCode[e.code]; handleNoteOff(KEY_MAP[pressed]); return; }
    if(state.editor || isTypingTarget(e.target) || (isUiControlTarget(e.target)&&['Enter',' '].includes(e.key))) return;
    if(state.midiBridgeConnected && KEY_MAP[e.key]!==undefined){ e.preventDefault(); return; }
    const k=e.key; if(KEY_MAP[k]!==undefined){ e.preventDefault(); handleNoteOff(KEY_MAP[k]); }
  });
  window.addEventListener('mouseup',()=>{ if(state.mouseMidi!==null){handleNoteOff(state.mouseMidi);state.mouseMidi=null;} });
  let keyboardResizeTimer=null;
  window.addEventListener('resize',()=>{ syncSideCardHeight(); if(state.keyWidthMode==='auto'){ clearTimeout(keyboardResizeTimer); keyboardResizeTimer=setTimeout(()=>{state.keyWidthInitialized=false;autoFitKeyboardWidth(false);},120); } });
  window.addEventListener('error', e=>{ app.innerHTML='<div class="error-screen"><b>Ошибка приложения:</b>\n'+escapeHtml(e.message||e.error||e)+'</div>'; });
  async function loadServicePracticeMelody(){
    if(!serviceClient)return false;
    const query=new URLSearchParams(location.search),privateId=query.get('privateMelody'),publicId=query.get('publication');
    if(!privateId&&!publicId)return false;
    if(privateId&&publicId)throw Error('Выбери одну мелодию для открытия.');
    const id=privateId||publicId;
    if(!/^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$/.test(id))throw Error('Некорректная ссылка на мелодию.');
    const result=await serviceClient.api(privateId?'/library/'+id:'/publications/'+id,{publicRequest:!privateId});
    const raw=result.data.entry,lessonId='service-'+(privateId?'private-':'public-')+id,themeId='service-theme-'+id;
    const item=makeLesson(lessonId,'Моя музыка',String(raw.title),String(raw.description),String(raw.pattern),Math.max(1,Number(raw.timeLimit)||90),Boolean(raw.exam));
    item.themeId=themeId;item.order=1;item.contentKind='piece';item.maxErrors=Math.max(1,Number(raw.maxErrors)||3);
    if(Object.prototype.hasOwnProperty.call(raw,'rhythm'))item.rhythm=normalizeLessonRhythm(raw.rhythm,item.steps.length);
    if(['left','right','split','auto'].includes(raw.handMode))item.handMode=raw.handMode;
    item.fingeringSpec=raw.fingeringSpec;item.fingeringPlan=normalizeStoredFingeringPlan(raw.fingeringPlan,item);
    item.description+=(privateId?'\nЛичная мелодия.':'\nПубликация пользователя: '+String(result.author)+'.')+' Источник: '+String(result.data.source||'авторская музыка')+'.';
    themes.push({id:themeId,name:String(raw.title),order:themes.length+1,contentKind:'piece'});lessons.push(item);
    serviceTemporaryLessons.add(lessonId);serviceTemporaryThemes.add(themeId);state.lesson=item;state.contentSection='pieces';state.sectionEmpty=false;state.stepIndex=0;state.practiceStart=0;state.message=privateId?'Открыта личная мелодия. Редактор и публикация находятся в «Моей музыке».':'Открыта пользовательская публикация для практики.';
    return true;
  }
  async function boot(){
    if(serviceClient){try{await serviceClient.init();loadUiPreferences();}catch(error){state.message=error.message;state.messageType='bad';}}
    loadCatalogWorkspace();
    loadLearningProgress();
    void legacyProgressStore.refresh();void preparationImportStore.readArchive();
    void preparationCapture.refresh();
    void fragmentCapture.refresh();
    connectMidiBridgeEvents();
    state.playbackBpm=lessonBpm(state.lesson);
    render();
    await loadCatalog();
    let servicePractice=false;try{servicePractice=await loadServicePracticeMelody();}catch(error){state.message=error.message;state.messageType='bad';}
    if(!servicePractice){
      restoreCatalogSelection();const query=new URLSearchParams(location.search),requested=(serviceCourseRequested(query)&&serviceCourseOriginal)||lessons.find(item=>item.id===query.get('lesson'));
      if(query.get('section')==='pieces')setContentSection('pieces');
      if(requested){selectLesson(requested.id);if(serviceCourseRequested(query)&&serviceCourseOriginal){state.lesson=serviceCourseOriginal;state.contentSection='learning';state.sectionEmpty=false;resetLessonState(true);}}
    }
    if(serviceClient&&window.PBT_RUNTIME?.gameVersion===1&&window.PianoGamePlayer){
      gamePlayer=window.PianoGamePlayer.create({client:serviceClient,
        readTrainer:()=>({lessonId:state.lesson.id,fingerprint:window.PracticeAssessment.pianoSignature(state.lesson),mode:state.attemptMode,completed:state.completed,midiConnected:Boolean(state.selectedInput)}),
        prepareTrainer:attempt=>{clearCatalogNotes();state.preparationSelection=null;state.preparationAttempt=null;state.rangeFull=true;state.rangeLesson=state.lesson.id;state.rangeStart=0;setAttemptMode(attempt.mode);state.playbackBpm=attempt.bpm;state.message='Серверная попытка открыта. Сыграй фразу на MIDI-пианино.';render();},render});
      try{await gamePlayer.load();}catch(error){state.message='Маршрут временно недоступен: '+error.message;state.messageType='warn';}
    }
    state.playbackBpm=lessonBpm(state.lesson);
    state.fingeringAudit=fingeringSelfCheck(state.lesson);
    state.curriculumAudit=auditBeginnerCurriculum(FULL_DIAGNOSTICS_REQUESTED);
    console.log('Fingering audit:', state.fingeringAudit.checked, 'notes checked; issues:', state.fingeringAudit.issues.length, state.fingeringAudit.issues.slice(0,10));
    console.log('Beginner curriculum audit:',state.curriculumAudit);
    render();
  }
  if(serviceClient)document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')void serviceClient.checkSession();});
  window.PBT_RUN_DIAGNOSTICS=(includeFingering=true)=>auditBeginnerCurriculum(Boolean(includeFingering));
  window.PBT_TEST_API={
    lessonIds:()=>lessons.map(lesson=>lesson.id),
    selectLesson,
    snapshot:()=>({lessonId:state.lesson.id,stepIndex:state.stepIndex,playbackIndex:state.playbackIndex,playbackPlaying:state.playbackPlaying,playbackVisualActive:state.playbackVisualActive,scoreProgressIndex:scoreProgressIndex()}),
    diagnostics:window.PBT_RUN_DIAGNOSTICS
  };
  boot();
})();
</script>
